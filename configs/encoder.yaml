# =============================================================================
# encoder.yaml — HP-ENCODER training configuration (mirror of §5, §6.1, §7)
# -----------------------------------------------------------------------------
# FROZEN (protocol v1.0). Single frozen configuration; no post-hoc tuning.
# =============================================================================

# --- Encoder models (§5; IDs per experiment_matrix §0.4) ----------------------
models:
  BERT: "bert-base-uncased"
  ROBERTA: "roberta-base"
  DEBERTA: "microsoft/deberta-v3-base"
  DISTIL: "distilbert-base-uncased"
  ALBERT: "albert-base-v2"

# --- Optimizer & schedule (§7) ------------------------------------------------
optimizer:
  name: "adamw"
  weight_decay: 0.01
  learning_rate: 2.0e-5          # encoder LR (fixed)

scheduler:
  name: "linear_warmup_cosine"
  warmup_ratio: 0.06             # linear warm-up 6% of steps -> cosine decay to 0
  decay_to: 0.0

# --- Training loop (§7) -------------------------------------------------------
training:
  batch_size: 16
  max_epochs: 10
  early_stopping:
    monitor: "val_macro_f1"
    patience: 3
    mode: "max"

# --- Sequence handling (§6.1) -------------------------------------------------
# Consumed by fnb.training.datasets (sliding windows; never single-pass truncate).
sequence:
  max_length: 512                # [FROZEN] equals window_tokens
  sliding_window:
    window_tokens: 512           # [FROZEN]
    stride_tokens: 128           # [FROZEN]
    window_logits_pooling: "mean"
  title_only_max_length: 64      # [FROZEN] RQ-E title-only condition (HP-TITLE)

# --- Loss / imbalance (§7) ----------------------------------------------------
loss:
  type: "class_weighted_cross_entropy"
  class_weighting: "inverse_frequency"
  smote: false                   # SMOTE PROHIBITED
