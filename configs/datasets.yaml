# =============================================================================
# datasets.yaml — dataset registry (mirror of final_protocol.md §4)
# -----------------------------------------------------------------------------
# FROZEN (protocol v1.0) for IDs, roles, text types, transfer membership, and the
# binarization mapping.
#
# Kaggle lineage fields (slug / version / input_path / columns / license) are
# resolved during EXP-P0 (Step S6). Candidate slugs below are starting points —
# pin the *exact* Kaggle dataset VERSION after attaching, then re-run P0 hashing.
# input_path is filled automatically by fnb.data.acquire when the dataset is
# attached under /kaggle/input/<dirname>/.
# =============================================================================

# --- Global label space (§4.3) -----------------------------------------------
# NOTE: some source files (e.g. WELFake on Zenodo) use 0=fake / 1=real. That
# polarity is remapped to this global space in EXP-P1a (S7), not here.
label_space:
  real: 0
  fake: 1

# --- Article-type transfer set (§4.2) -----------------------------------------
article_transfer_set: ["DS1", "DS2", "DS3"]
domain_shift_probe: ["DS4"]
short_statement_track: ["DS5"]

# --- Datasets (§4.1) ----------------------------------------------------------
datasets:
  DS1:
    name: "WELFake"
    role: "Primary in-distribution + leakage case study (RQ-B)"
    text_type: "Article (title+text)"
    in_article_transfer: true
    # Candidate Kaggle dataset (confirm version on the dataset page after attach):
    kaggle_slug: "saurabhshahane/fake-news-classification"
    kaggle_version: "TBD"          # pin after attach, e.g. "3"
    input_dirname: "fake-news-classification"
    input_path: "/kaggle/input/datasets/saurabhshahane/fake-news-classification"
    label_column: "label"           # confirm after inspect; often Label/label
    text_columns: { title: "title", body: "text" }
    # WELFake source polarity is often 0=fake, 1=real (Zenodo); remap in S7.
    source_label_polarity: "0=fake,1=real (confirm on attach)"
    source_field_available: false
    license_note: "CC BY-NC 4.0 (Attribution-NonCommercial); research use OK"

  DS2:
    name: "ISOT"
    role: "Saturation / easy anchor"
    text_type: "Article (title+text)"
    in_article_transfer: true
    kaggle_slug: "clmentbisaillon/fake-and-real-news-dataset"
    kaggle_version: "TBD"
    input_dirname: "fake-and-real-news-dataset"
    input_path: "/kaggle/input/datasets/clmentbisaillon/fake-and-real-news-dataset"
    label_column: "label"           # often derived from True.csv / Fake.csv filenames
    text_columns: { title: "title", body: "text" }
    source_field_available: "subject"   # ISOT has a subject column; not a publisher id
    license_note: "University of Victoria ISOT Research Lab; publicly available"

  DS3:
    name: "FakeNewsNet (PolitiFact+GossipCop)"
    role: "Transfer target"
    text_type: "Article (title+text)"
    in_article_transfer: true
    # Prefer a HYDRATED Kaggle snapshot — do NOT re-crawl (§4.6).
    kaggle_slug: "TBD"              # confirm hydrated FakeNewsNet copy together on Kaggle
    kaggle_version: "TBD"
    input_dirname: "TBD"
    input_path: "TBD"
    label_column: "TBD"
    text_columns: { title: "TBD", body: "TBD" }
    recovery_fraction: "TBD"        # hydrated / expected; record after inspect
    license_note: "FakeNewsNet (KaiDMML); content via hydrated snapshot only — no redistribution beyond permitted terms"

  DS4:
    name: "COVID-19 Fake News"
    role: "Domain-shift probe (test target only)"
    text_type: "Short article / claim"
    in_article_transfer: false
    kaggle_slug: "TBD"              # confirm CONSTRAINT / COVID-19 Fake News copy on Kaggle
    kaggle_version: "TBD"
    input_dirname: "TBD"
    input_path: "TBD"
    label_column: "TBD"
    text_columns: { title: "TBD", body: "TBD" }
    license_note: "Public COVID-19 / CONSTRAINT-style fake-news corpus; confirm license on dataset page"

  DS5:
    name: "LIAR"
    role: "Hard short-statement control (analyzed separately)"
    text_type: "Short statement"
    in_article_transfer: false
    # Plan B: official LIAR zip uploaded as a private Kaggle dataset by the project owner.
    kaggle_slug: "isthisdeception/liar-dataset"
    kaggle_version: "1"            # confirm on dataset page; bump if you re-upload
    input_dirname: "liar-dataset"
    input_path: "/kaggle/input/datasets/isthisdeception/liar-dataset"
    label_column: "label"           # column 2 in the TSV (no header in official LIAR)
    text_columns: { statement: "statement" }  # column 3 in the TSV
    tsv_files: ["train.tsv", "valid.tsv", "test.tsv"]
    tsv_has_header: false
    # Official LIAR TSV columns (Wang 2017):
    # id, label, statement, subject, speaker, job_title, state_info, party,
    # barely_true_counts, false_counts, half_true_counts, mostly_true_counts,
    # pants_on_fire_counts, context
    license_note: "Public LIAR (Wang 2017 ACL); uploaded snapshot isthisdeception/liar-dataset for reproducibility"
    liar_binary_map:
      fake: ["pants-fire", "false", "barely-true"]
      real: ["half-true", "mostly-true", "true"]

# --- Frozen data-version lineage tags (experiment_matrix §0.2) -----------------
version_tags:
  vRAW: "committed raw snapshot; SHA-256 in data/SNAPSHOT_HASHES.txt (§4.6)"
  vBIN: "after frozen binary label mapping {real=0, fake=1}; ambiguous rows dropped + counted (§4.3)"
  vCLEAN-C: "classical-track preprocessing (§6)"
  vCLEAN-N: "neural-track preprocessing (§6)"
  vDEDUP: "after within-dataset exact + near-dup removal (TF-IDF cosine >= 0.95) (§4.5)"
  vXDEDUP: "after cross-dataset test-side removal (cosine >= 0.90 to any train item); per transfer pair (§4.5)"
  vDEDUP_sensitivity: ["vDEDUP@0.90", "vDEDUP@0.95", "vDEDUP@0.98"]

# --- LLM contamination handling (§4.7) ----------------------------------------
llm_contamination:
  probe: "guided prefix-completion memorization test, per LLM per dataset"
  report_to: "results/llm_contamination.csv"
  rule: "datasets flagged contaminated for an LLM are excluded from that LLM's zero-shot claims"
